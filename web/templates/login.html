{{define "content"}}
<main id="main" class="page page-login">
  <div class="card login-card">
    <div class="login-head">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>관리자 로그인</h1>
      <p>이 서비스의 관리자는 한 명입니다. 회원가입은 제공하지 않습니다.</p>
    </div>

    {{if .Error}}<p class="alert alert-error" role="alert">{{.Error}}</p>{{end}}
    {{if .Message}}<p class="alert alert-info">{{.Message}}</p>{{end}}

    <form method="post" action="/adminpage/login" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="field">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" required autocomplete="username"
               autocapitalize="none" spellcheck="false" maxlength="64">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               maxlength="256">
      </div>
      <button class="btn btn-primary btn-block" type="submit">로그인</button>
    </form>

    <p class="login-foot"><a href="/">QR 생성기로 돌아가기</a></p>
  </div>
</main>
{{end}}
