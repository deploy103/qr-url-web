# /etc/nginx/snippets/qrurl-proxy-docker.conf
#
# Proxy settings for the containerised backend on mvtp-web-net. The upstream
# is a variable so nginx re-resolves the container name through Docker DNS
# instead of caching the address at startup.

proxy_pass $qrurl_upstream;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    60s;

proxy_buffering on;
proxy_redirect off;
