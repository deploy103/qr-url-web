# internal-nginx vhost for url.mvtp.cloud
#
# Drop this into the internal-nginx configuration next to the other
# *.mvtp.cloud vhosts. It resolves the backend by container name on
# mvtp-web-net, exactly like the existing services do.
#
# The zones have to live in the http context; if this file is included from
# inside http (the usual conf.d layout) they can stay here.

limit_req_zone $binary_remote_addr zone=qrurl_public:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=qrurl_admin:10m  rate=5r/s;
limit_req_zone $binary_remote_addr zone=qrurl_login:10m  rate=10r/m;

server {
    listen 80;
    server_name url.mvtp.cloud;

    # Let Docker's embedded DNS resolve the container name, and re-resolve it
    # so a rebuild that changes the address does not need an nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $qrurl_upstream http://qr-url:8013;

    server_tokens off;

    # The QR preview carries its payload in the query string, so the request
    # line can legitimately reach a few kilobytes.
    large_client_header_buffers 4 32k;
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    access_log /var/log/nginx/url.mvtp.cloud.access.log;
    error_log  /var/log/nginx/url.mvtp.cloud.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # The application sets HSTS, CSP, X-Frame-Options and the rest itself.
    # Adding them here too would send conflicting duplicates.

    location = /adminpage/login {
        limit_req zone=qrurl_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/qrurl-proxy-docker.conf;
    }

    location /adminpage {
        limit_req zone=qrurl_admin burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/qrurl-proxy-docker.conf;
    }

    # Health is for the local monitoring only; the application itself also
    # withholds its build details from anything that is not on the loopback.
    location = /health {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/24;
        allow 172.16.0.0/12;
        deny all;
        include /etc/nginx/snippets/qrurl-proxy-docker.conf;
    }

    location /static/ {
        limit_req zone=qrurl_public burst=100 nodelay;
        include /etc/nginx/snippets/qrurl-proxy-docker.conf;
    }

    # Landing page, QR rendering and the 001-999 redirects.
    location / {
        limit_req zone=qrurl_public burst=50 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/qrurl-proxy-docker.conf;
    }
}
