# /etc/nginx/sites-available/url.mvtp.cloud
#
# Internet -> Nginx (TLS) -> 127.0.0.1:8080 (qrurl) -> SQLite
#
# The rate limit zones have to live in the http context. If you keep this file
# under sites-available, move the two limit_req_zone lines into
# /etc/nginx/conf.d/qrurl-limits.conf instead.

limit_req_zone $binary_remote_addr zone=qrurl_public:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=qrurl_admin:10m  rate=5r/s;
limit_req_zone $binary_remote_addr zone=qrurl_login:10m  rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name url.mvtp.cloud;

    # Keep this location if you renew certificates with the webroot plugin.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name url.mvtp.cloud;

    ssl_certificate     /etc/letsencrypt/live/url.mvtp.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/url.mvtp.cloud/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/url.mvtp.cloud/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:QRURL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # The application already emits HSTS, CSP, X-Frame-Options and friends.
    # Do not duplicate them here or browsers will see two conflicting values.

    server_tokens off;

    # The QR preview endpoint carries its payload in the query string, so the
    # request line can legitimately reach a few kilobytes.
    large_client_header_buffers 4 32k;
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    access_log /var/log/nginx/url.mvtp.cloud.access.log;
    error_log  /var/log/nginx/url.mvtp.cloud.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # --- administrator login: the tightest limit ----------------------------
    location = /adminpage/login {
        limit_req zone=qrurl_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/qrurl-proxy.conf;
    }

    # --- administrator console ----------------------------------------------
    location /adminpage {
        limit_req zone=qrurl_admin burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/qrurl-proxy.conf;
    }

    # --- health check: local monitoring only --------------------------------
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        include /etc/nginx/snippets/qrurl-proxy.conf;
    }

    # --- static assets are content hashed and safe to cache -----------------
    location /static/ {
        limit_req zone=qrurl_public burst=100 nodelay;
        proxy_cache_valid 200 1h;
        include /etc/nginx/snippets/qrurl-proxy.conf;
    }

    # --- everything else: landing page, QR rendering, 001-999 redirects -----
    location / {
        limit_req zone=qrurl_public burst=50 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/qrurl-proxy.conf;
    }
}
